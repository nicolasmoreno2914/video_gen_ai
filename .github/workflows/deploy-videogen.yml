name: Deploy Videogen → Contabo (manual)

# ────────────────────────────────────────────────────────────────────────────────
# Este workflow solo se activa manualmente desde la UI de GitHub Actions.
# NO se dispara en push. Diseño intencional hasta que el deploy sea estable.
#
# Cuándo usarlo:
#   GitHub → Actions → "Deploy Videogen → Contabo (manual)" → Run workflow
#
# Secrets requeridos en el repositorio (Settings → Secrets → Actions):
#   VIDEOGEN_VPS_HOST     — IP o hostname del VPS Contabo
#   VIDEOGEN_VPS_USER     — usuario SSH (ej: videogen)
#   VIDEOGEN_VPS_SSH_KEY  — clave privada SSH (sin passphrase)
#   VIDEOGEN_VPS_PATH     — ruta del proyecto en el VPS (ej: /var/www/videogen)
#   VIDEOGEN_HEALTH_URL   — URL de health check (ej: https://videosb.nomaddi.com/health)
# ────────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Rama a desplegar'
        required: true
        default: 'main'
      run_migrations:
        description: 'Ejecutar migraciones de DB'
        required: true
        type: boolean
        default: true

jobs:
  # ── 1. Build check local ────────────────────────────────────────────────────
  build-check:
    name: Build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build check
        run: npm run build

      - name: Build OK — artefactos de dist/ disponibles
        run: ls -la dist/

  # ── 2. Deploy al VPS ────────────────────────────────────────────────────────
  deploy:
    name: Deploy a Contabo
    runs-on: ubuntu-latest
    needs: build-check
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Configurar SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VIDEOGEN_VPS_SSH_KEY }}

      - name: Agregar VPS a known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.VIDEOGEN_VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Ejecutar deploy en VPS
        env:
          VPS_HOST: ${{ secrets.VIDEOGEN_VPS_HOST }}
          VPS_USER: ${{ secrets.VIDEOGEN_VPS_USER }}
          VPS_PATH: ${{ secrets.VIDEOGEN_VPS_PATH }}
          BRANCH:   ${{ github.event.inputs.branch }}
          RUN_MIGRATIONS: ${{ github.event.inputs.run_migrations }}
        run: |
          ssh -o StrictHostKeyChecking=no "${VPS_USER}@${VPS_HOST}" bash -s <<EOF
            set -euo pipefail
            cd "${VPS_PATH}"

            echo "=== [1/5] Git pull ==="
            git fetch origin ${BRANCH}
            git checkout ${BRANCH}
            git pull origin ${BRANCH}
            git log --oneline -3

            echo "=== [2/5] npm install ==="
            cd backend
            npm ci --omit=optional

            echo "=== [3/5] Build ==="
            npm run build

            if [[ "${RUN_MIGRATIONS}" == "true" ]]; then
              echo "=== [4/5] Migraciones ==="
              npm run migration:run || echo "WARNING: migraciones fallaron, continúa revisando"
            else
              echo "=== [4/5] Migraciones OMITIDAS (input: false) ==="
            fi

            echo "=== [5/5] PM2 reload ==="
            cd "${VPS_PATH}"
            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production
            pm2 save
          EOF

      - name: Health check post-deploy
        env:
          HEALTH_URL: ${{ secrets.VIDEOGEN_HEALTH_URL }}
        run: |
          echo "Esperando 15s para que el servidor arranque..."
          sleep 15
          MAX=8
          N=0
          until curl -sf "${HEALTH_URL}" > /dev/null; do
            N=$((N+1))
            if [ $N -ge $MAX ]; then
              echo "Health check falló tras $MAX intentos."
              exit 1
            fi
            echo "Intento $N/$MAX — esperando 10s..."
            sleep 10
          done
          echo "✅ Health check OK: ${HEALTH_URL}"
          curl -s "${HEALTH_URL}" | python3 -m json.tool || true

      - name: Resumen del deploy
        if: success()
        run: |
          echo ""
          echo "✅ Deploy completado"
          echo "   Rama:    ${{ github.event.inputs.branch }}"
          echo "   Commit:  ${{ github.sha }}"
          echo "   Hora:    $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "   URL:     ${{ secrets.VIDEOGEN_HEALTH_URL }}"

      - name: Notificar fallo
        if: failure()
        run: |
          echo "❌ Deploy FALLIDO"
          echo "   Revisa los logs del job en GitHub Actions"
          echo "   Para rollback manual:"
          echo "     ssh user@vps 'cd /var/www/videogen && git checkout HEAD~1 && cd backend && npm run build && pm2 reload ecosystem.config.js --env production'"
