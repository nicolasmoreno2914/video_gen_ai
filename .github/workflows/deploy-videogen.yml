name: Deploy Videogen → Contabo (manual)

# ────────────────────────────────────────────────────────────────────────────────
# Secrets requeridos (Settings → Secrets → Actions):
#   VIDEOGEN_VPS_HOST     — IP o hostname del VPS Contabo
#   VIDEOGEN_VPS_USER     — usuario SSH (ej: videogen)
#   VIDEOGEN_VPS_SSH_KEY  — clave privada SSH (sin passphrase)
#   VIDEOGEN_VPS_PATH     — ruta del proyecto en el VPS (ej: /var/www/videogen)
#   VIDEOGEN_HEALTH_URL   — URL de health check (ej: https://videosb.nomaddi.com/health)
# ────────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Rama a desplegar'
        required: true
        default: 'staging'
      run_migrations:
        description: 'Ejecutar migraciones de DB'
        required: true
        type: boolean
        default: true

jobs:
  deploy:
    name: Deploy a Contabo
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configurar SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VIDEOGEN_VPS_SSH_KEY }}

      - name: Agregar VPS a known_hosts
        run: ssh-keyscan -H ${{ secrets.VIDEOGEN_VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy en VPS
        env:
          VPS_HOST: ${{ secrets.VIDEOGEN_VPS_HOST }}
          VPS_USER: ${{ secrets.VIDEOGEN_VPS_USER }}
          VPS_PATH: ${{ secrets.VIDEOGEN_VPS_PATH }}
          BRANCH:   ${{ github.event.inputs.branch }}
          RUN_MIGRATIONS: ${{ github.event.inputs.run_migrations }}
        run: |
          ssh -o StrictHostKeyChecking=no "${VPS_USER}@${VPS_HOST}" bash -s <<EOF
            set -euo pipefail
            cd "${VPS_PATH}"

            echo "=== [1/5] Git pull (${BRANCH}) ==="
            git fetch origin ${BRANCH}
            git checkout ${BRANCH}
            git pull origin ${BRANCH}
            git log --oneline -3

            echo "=== [2/5] npm install ==="
            cd backend
            npm ci --omit=optional

            echo "=== [3/5] Build ==="
            npm run build

            if [[ "${RUN_MIGRATIONS}" == "true" ]]; then
              echo "=== [4/5] Migraciones ==="
              npm run migration:run || echo "WARNING: migraciones ya aplicadas o fallaron — revisa manualmente"
            else
              echo "=== [4/5] Migraciones OMITIDAS ==="
            fi

            echo "=== [5/5] PM2 reload ==="
            cd "${VPS_PATH}"
            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production
            pm2 save
          EOF

      - name: Health check
        env:
          HEALTH_URL: ${{ secrets.VIDEOGEN_HEALTH_URL }}
        run: |
          sleep 15
          for i in 1 2 3 4 5 6 7 8; do
            if curl -sf "${HEALTH_URL}" > /dev/null; then
              echo "✅ Health check OK: ${HEALTH_URL}"
              curl -s "${HEALTH_URL}" | python3 -m json.tool || true
              exit 0
            fi
            echo "Intento $i/8 — esperando 10s..."
            sleep 10
          done
          echo "❌ Health check falló"
          exit 1

      - name: Resumen
        if: success()
        run: |
          echo "✅ Deploy completado — rama: ${{ github.event.inputs.branch }} — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
