name: Sync backend → video-gen-ai-backend

on:
  push:
    branches:
      - staging
      - main
    paths:
      - 'backend/**'

jobs:
  sync:
    name: Push backend subtree to Hostinger repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout monorepo (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Setup SSH deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BACKEND_DEPLOY_KEY }}

      - name: Add github.com to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Split backend/ subtree into temp branch
        run: |
          git subtree split --prefix=backend -b backend-deploy

      - name: Push to video-gen-ai-backend repo (SSH)
        run: |
          git remote add backend-repo \
            git@github.com:nicolasmoreno2914/video-gen-ai-backend.git
          git push backend-repo backend-deploy:main --force

      - name: Cleanup temp branch
        if: always()
        run: git branch -D backend-deploy || true
