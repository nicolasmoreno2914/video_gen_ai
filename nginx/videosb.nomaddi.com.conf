# /etc/nginx/sites-available/videosb.nomaddi.com
# Reverse proxy Videogen — VPS Contabo
#
# Puerto: Videogen corre en localhost:3001 (NODE_ENV=production, PORT=3001)
#
# Activar:
#   sudo ln -s /etc/nginx/sites-available/videosb.nomaddi.com \
#              /etc/nginx/sites-enabled/videosb.nomaddi.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL: generado por Certbot (certbot --nginx -d videosb.nomaddi.com)

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name videosb.nomaddi.com;

    # Certbot ACME challenge (necesario antes de tener SSL)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name videosb.nomaddi.com;

    # ── SSL (Certbot completa estos bloques automáticamente) ────────────────────
    ssl_certificate     /etc/letsencrypt/live/videosb.nomaddi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/videosb.nomaddi.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Seguridad básica ────────────────────────────────────────────────────────
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # ── Límites ─────────────────────────────────────────────────────────────────
    # client_max_body_size: suficiente para scripts largos y payloads batch
    client_max_body_size    50M;

    # proxy_read_timeout: la generación de video puede tardar varios minutos
    proxy_read_timeout      600s;
    proxy_connect_timeout   30s;
    proxy_send_timeout      600s;
    send_timeout            600s;

    # ── Proxy al backend Videogen (PORT=3001) ───────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Server-Sent Events (SSE de progreso de video) y streaming de MP4
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }

    # ── Health check — acceso directo, sin logs de disco ───────────────────────
    location = /health {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;
    }
}
